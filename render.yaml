# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One always-on Starter instance runs the API *and* the reminder worker
# (RUN_WORKER_IN_API=true). The SQLite database lives on a 1 GB persistent disk at /data.
# Free instances sleep (and have no disks), which would silently stop reminders — so this
# uses the cheapest always-on plan. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: dueora-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    region: frankfurt
    healthCheckPath: /health
    autoDeploy: true
    numInstances: 1 # SQLite: exactly one instance writes the database
    disk:
      name: dueora-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: RUN_WORKER_IN_API
        value: "true"
      - key: DATABASE_URL
        value: file:/data/dueora.db
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: SUBSCRIPTION_KEY_SECRET
        generateValue: true # never change it after real data exists
      - key: API_BASE_URL
        sync: false # e.g. https://dueora-api.onrender.com
      - key: APP_URL
        value: dueora://
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false # e.g. DueOra <reminders@yourdomain.com>
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: LOG_LEVEL
        value: info
