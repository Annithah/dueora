name: Progress page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # prisma.config.ts requires it for `prisma generate`; tests use their own temp databases.
      DATABASE_URL: file:./ci.db
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            mobile/package-lock.json

      - name: Install
        run: |
          npm ci
          npm --prefix backend ci
          npm --prefix mobile ci

      - name: Build progress page (runs the tests; failures are shown on the page, not fatal)
        env:
          CI: 'true'
        run: npm run progress -- --run-tests

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
